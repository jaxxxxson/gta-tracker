<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA RP Tracker - Угон транспорта</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { text-align: center; margin-bottom: 15px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: var(--accent-hover); }
        .timer-display { text-align: center; font-size: 28px; font-weight: bold; color: var(--success); margin: 15px 0; background: var(--bg-color); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: var(--bg-color); border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: center; }
        .stat-card span { display: block; font-size: 22px; font-weight: bold; color: var(--accent); margin-top: 5px; }
        .history-list { margin-top: 20px; max-height: 150px; overflow-y: auto; background: var(--bg-color); padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }
        .history-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GTA RP Tracker</h1>
        <div class="subtitle">Управление угонами и таймер сдачи транспорта</div>

        <div class="form-group">
            <label>Выберите автомобиль / уровень</label>
            <select id="carSelect">
                <optgroup label="Обычные авто">
                    <option value="Karin Sultan|15000">Karin Sultan ($15,000)</option>
                    <option value="Benefactor Schafter|18000">Benefactor Schafter ($18,000)</option>
                    <option value="Lampadati Felon|22000">Lampadati Felon ($22,000)</option>
                </optgroup>
                <optgroup label="Элитный 7 уровень">
                    <option value="Pfister Comet S2|45000">Pfister Comet S2 ($45,000)</option>
                    <option value="Obey Tailgater S|50000">Obey Tailgater S ($50,000)</option>
                    <option value="Übermacht Sentinel XS|60000">Übermacht Sentinel XS ($60,000)</option>
                </optgroup>
            </select>
        </div>

        <button onclick="startTracker()">Начать угон / Запустить таймер</button>

        <div class="timer-display" id="timer">00:00</div>

        <div class="stats-grid">
            <div class="stat-card">Всего угонов <span id="totalThefts">0</span></div>
            <div class="stat-card">Заработано ($) <span id="totalEarned">0</span></div>
        </div>

        <div class="history-list" id="historyList">
            <div style="color: var(--text-muted); text-align: center;">История угонов пуста</div>
        </div>
    </div>

    <script>
        let countdown;

        function startTracker() {
            const select = document.getElementById('carSelect');
            const [carName, rewardStr] = select.value.split('|');
            const reward = parseInt(rewardStr);

            let timeLeft = 180; // 3 минуты таймер
            clearInterval(countdown);

            countdown = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                document.getElementById('timer').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    document.getElementById('timer').innerText = 'Время вышло!';
                    addStats(carName, reward);
                }
                timeLeft--;
            }, 1000);
        }

        function addStats(car, reward) {
            let stats = JSON.parse(localStorage.getItem('gta_tracker_stats') || '{"count": 0, "earned": 0, "history": []}');
            stats.count += 1;
            stats.earned += reward;
            stats.history.unshift({ car, reward, time: new Date().toLocaleTimeString() });

            localStorage.setItem('gta_tracker_stats', JSON.stringify(stats));
            loadStats();
        }

        function loadStats() {
            let stats = JSON.parse(localStorage.getItem('gta_tracker_stats') || '{"count": 0, "earned": 0, "history": []}');
            document.getElementById('totalThefts').innerText = stats.count;
            document.getElementById('totalEarned').innerText = stats.earned;

            const historyEl = document.getElementById('historyList');
            if (stats.history.length > 0) {
                historyEl.innerHTML = stats.history.map(item => `
                    <div class="history-item">
                        <span>${item.car} (+${item.reward}$)</span>
                        <span style="color: var(--text-muted);">${item.time}</span>
                    </div>
                `).join('');
            }
        }

        window.onload = loadStats;
    </script>
</body>
</html>
