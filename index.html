<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA RP Tracker - Вход по ключу</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
        input { width: 100%; padding: 12px 16px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; outline: none; text-align: center; letter-spacing: 1px; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        #message { margin-top: 15px; text-align: center; font-size: 14px; }
        .error { color: var(--danger); }
        .success { color: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <h1>GTA RP Tracker</h1>
        <div class="subtitle">Введите ваш временный ключ доступа</div>
        
        <div class="form-group">
            <label>Ключ активации</label>
            <input type="text" id="accessKey" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off">
        </div>
        
        <button onclick="verifyKey()">Войти в систему</button>
        <div id="message"></div>
    </div>

    <script>
        async function verifyKey() {
            const key = document.getElementById('accessKey').value.trim();
            const msg = document.getElementById('message');
            
            if (!key) {
                msg.className = 'error';
                msg.innerText = 'Введите ключ доступа!';
                return;
            }

            msg.className = '';
            msg.innerText = 'Проверка ключа...';

            try {
                // Запрос к твоему бэкенду на Render для проверки ключа и его срока действия
                const response = await fetch('https://gta-tracker-api-7oo0.onrender.com/api/verify-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    msg.className = 'success';
                    msg.innerText = `Ключ действителен! Вход выполнен (до ${data.expires_at || 'бессрочно'})`;
                    // Здесь будет перенаправление на главный экран трекера угонов
                } else {
                    msg.className = 'error';
                    msg.innerText = data.error || 'Неверный или просроченный ключ!';
                }
            } catch (err) {
                msg.className = 'error';
                msg.innerText = 'Ошибка соединения с сервером бэкенда.';
            }
        }
    </script>
</body>
</html>
